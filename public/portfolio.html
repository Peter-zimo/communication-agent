<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AI 产品与售前解决方案作品集</title>
  <link rel="stylesheet" href="/portfolio.css">
  <script src="/portfolio.js" defer></script>
</head>
<body>
  <header class="site-header">
    <a class="wordmark" href="#top" aria-label="返回作品集顶部">作品集 / 01</a>
    <nav aria-label="作品集导航">
      <a href="#featuredProjects">作品集</a>
      <a href="#about">关于我</a>
      <a href="#contact">联系</a>
      <a class="nav-cta" href="#featuredProjects">进入案例</a>
    </nav>
  </header>

  <main id="top">
    <section class="hero" aria-labelledby="portfolioTitle">
      <p class="eyebrow">[ 姓名占位 ] · AI 产品与解决方案</p>
      <h1 id="portfolioTitle">AI 产品与售前解决方案作品集</h1>
      <p class="hero-copy">从业务理解出发，把信息、决策和交付组织成可演示、可持续迭代的产品工作流。</p>
      <div class="hero-meta">
        <span>本机演示版本</span>
        <span>可替换身份与联系信息</span>
      </div>
    </section>

    <section id="featuredProjects" class="projects-section" aria-labelledby="projectsTitle">
      <div class="section-heading">
        <p class="eyebrow">Selected work</p>
        <h2 id="projectsTitle">精选案例</h2>
      </div>
      <p id="projectStatus" class="status-message" role="status">正在读取案例。</p>
      <div id="projectList" class="project-grid" aria-live="polite"></div>
    </section>

    <section id="caseReader" class="case-reader" aria-labelledby="caseReaderTitle" hidden tabindex="-1">
      <div class="section-heading">
        <p class="eyebrow">Case reader</p>
        <h2 id="caseReaderTitle">案例阅读</h2>
      </div>
      <div id="caseContent"></div>
    </section>

    <section id="about" class="about-section" aria-labelledby="aboutTitle">
      <div class="section-heading">
        <p class="eyebrow">Capabilities</p>
        <h2 id="aboutTitle">能力与交付方式</h2>
      </div>
      <ul class="capability-list">
        <li>业务理解</li>
        <li>AI 工作流设计</li>
        <li>原型与工程实现</li>
        <li>交付演示</li>
      </ul>
    </section>
  </main>

  <footer id="contact" class="site-footer">
    <p>[ 联系方式占位：邮箱 / 微信 / 简历链接 ]</p>
    <p>欢迎讨论复杂业务场景中的产品与 AI 工作流。</p>
  </footer>

  <dialog id="imageDialog" aria-labelledby="imageDialogTitle">
    <div class="dialog-header">
      <p id="imageDialogTitle">案例图片</p>
      <button id="closeImageDialog" type="button">关闭</button>
    </div>
    <img id="dialogImage" alt="">
  </dialog>
</body>
</html>
